[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Charles Donohue"]
repository = "https://github.com/gitdonohue/VisualReplayDebugger"

[workspace.dependencies]
vrd-format = { path = "crates/format" }
vrd-model = { path = "crates/model" }
vrd-engine = { path = "crates/engine" }
vrd-scene = { path = "crates/scene" }
vrd-render = { path = "crates/render" }
vrd-ui-egui = { path = "crates/ui-egui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
