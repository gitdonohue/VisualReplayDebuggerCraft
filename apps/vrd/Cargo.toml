[package]
name = "vrd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.33.3"
vrd-ui-egui = { version = "0.1.0", path = "../../crates/ui-egui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# eframe's wgpu feature does not pick a graphics backend; without one wgpu panics at startup.
wgpu = { version = "27", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }

[lints]
workspace = true
