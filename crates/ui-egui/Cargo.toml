[package]
name = "vrd-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
egui = "0.33.3"
egui-wgpu = { version = "0.33.3", default-features = false }
egui_extras = { version = "0.33.3", default-features = false }
rfd = "0.17.2"
vrd-engine = { version = "0.1.0", path = "../engine" }
vrd-model = { version = "0.1.0", path = "../model" }
vrd-render = { version = "0.1.0", path = "../render" }
vrd-scene = { version = "0.1.0", path = "../scene" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.79"

[dev-dependencies]
vrd-format = { path = "../format" }
